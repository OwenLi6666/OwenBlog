name: Upstream Auto-Sync & Notification

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *"  # 每天凌晨 02:00 UTC (阿联酋 06:00) 自动检查并同步
  workflow_dispatch:      # 保留 GitHub 网页端手动触发按钮

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_and_notify:
    name: Sync NotionNext & Notify
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check Upstream Updates
        id: check_upstream
        run: |
          git remote add upstream https://github.com/notionnext-org/NotionNext.git 2>/dev/null || git remote set-url upstream https://github.com/notionnext-org/NotionNext.git
          git fetch upstream main

          NEW_COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "Found $NEW_COUNT new commit(s) from upstream."

          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "commit_count=$NEW_COUNT" >> $GITHUB_OUTPUT

            COMMITS=$(git log HEAD..upstream/main --pretty=format:"• %s (%h)" -n 10)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Auto Merge & Push
        id: merge_code
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: |
          if git merge --no-edit upstream/main; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            git push origin main
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      - name: Send Feishu Notification
        if: steps.check_upstream.outputs.has_updates == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MERGE_STATUS: ${{ steps.merge_code.outputs.merge_status }}
          COMMIT_COUNT: ${{ steps.check_upstream.outputs.commit_count }}
          COMMIT_LOGS: ${{ steps.check_upstream.outputs.commits }}
        run: |
          python3 - << 'PYEOF'
          import os
          import json
          import urllib.request

          webhook_url = os.environ.get("FEISHU_WEBHOOK_URL")
          if not webhook_url:
              print("FEISHU_WEBHOOK_URL not configured in Secrets. Skipping notification.")
              exit(0)

          status = os.environ.get("MERGE_STATUS", "unknown")
          count = os.environ.get("COMMIT_COUNT", "0")
          logs = os.environ.get("COMMIT_LOGS", "")

          if status == "success":
              title = "🎉 NotionNext 博客已自动同步上游最新功能"
              header_color = "green"
              status_text = "✅ **已自动合并并触发 Vercel 构建上线**"
          else:
              title = "⚠️ NotionNext 博客同步检测到代码冲突"
              header_color = "orange"
              status_text = "⚠️ **上游与你的个性化配置有冲突，已自动安全暂停合并（线上博客保持稳定）**"

          card = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "title": {"tag": "plain_text", "content": title},
                      "template": header_color
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"{status_text}\n\n**本次同步提交数**：{count} 处\n\n**新特性与更新清单：**\n{logs}"
                          }
                      },
                      {
                          "tag": "hr"
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "查看 GitHub 仓库"},
                                  "type": "primary",
                                  "url": "https://github.com/OwenLi6666/OwenBlog"
                              }
                          ]
                      }
                  ]
              }
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(card).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Feishu notification response status:", resp.status)
          except Exception as e:
              print("Failed to send Feishu notification:", e)
          PYEOF
